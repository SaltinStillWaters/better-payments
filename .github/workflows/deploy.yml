name: Deploy

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Stellar network"
        required: true
        default: "testnet"
        type: choice
        options:
          - testnet

jobs:
  contract:
    name: Build and Deploy Contract
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt

      - name: Build contract
        working-directory: contract
        run: cargo build --target wasm32v1-none --release

      - name: Deploy contract
        id: deploy
        env:
          STELLAR_ESCROW_DEPLOYER_KEY: ${{ secrets.STELLAR_ESCROW_DEPLOYER_KEY }}
          ADMIN_ADDRESS: ${{ vars.ADMIN_ADDRESS }}
          ESCROW_TIMEOUT_SECONDS: ${{ vars.ESCROW_TIMEOUT_SECONDS }}
          TOKEN_ADDRESS: ${{ vars.TOKEN_ADDRESS }}
        run: |
          echo "$STELLAR_ESCROW_DEPLOYER_KEY" > deployer.txt
          stellar keys add escrow-deployer --secret-key-file deployer.txt --network testnet
          CONTRACT_ID=$(stellar contract deploy \
            --wasm contract/target/wasm32v1-none/release/escrow.wasm \
            --source escrow-deployer \
            --network testnet \
            -- \
            initialize \
            --admin "$ADMIN_ADDRESS" \
            --timeout_seconds "$ESCROW_TIMEOUT_SECONDS" \
            --xlm_sac_address "$TOKEN_ADDRESS")
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          rm -f deployer.txt

      - name: Output contract ID
        run: echo "Deployed contract ${{ steps.deploy.outputs.contract_id }}"

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          NEXT_PUBLIC_FRIENDBOT_URL: https://friendbot.stellar.org
          NEXT_PUBLIC_ESCROW_CONTRACT_ID: ${{ needs.contract.outputs.contract_id }}
          NEXT_PUBLIC_TOKEN_ADDRESS: ${{ vars.TOKEN_ADDRESS }}
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: .next/
