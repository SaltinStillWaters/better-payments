[package]
name = "escrow-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
escrow = { path = ".." }
soroban-sdk = { version = "26.1.0", features = ["testutils"] }

[[bin]]
name = "escrow_fuzz"
path = "fuzz_targets/escrow_fuzz.rs"
test = false
doc = false
